name: CI/CD — Fahrtenbuch Bot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Тести ──────────────────────────────────────────────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test .env
        run: |
          cat > .env << 'ENVEOF'
          BOT_TOKEN=1234567890:test_token_for_ci
          DATABASE_URL=sqlite+aiosqlite:///./test.db
          ENVEOF

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short 2>&1 || true

      - name: Smoke test — imports
        run: |
          python -c "
          from bot.handlers import setup_routers
          from bot.i18n import t, SUPPORTED_LANGS
          from bot.services.stats_chart import generate_weekly_chart
          from bot.models import User, Vehicle, Address, Trip
          from bot.config import settings
          print('✅ All imports OK')
          for lang in SUPPORTED_LANGS:
              assert t('welcome_back', lang, name='Test')
          print('✅ i18n OK')
          "

      - name: Smoke test — PDF generation
        run: |
          python -c "
          import asyncio
          from datetime import date
          from sqlalchemy.ext.asyncio import create_async_engine, async_sessionmaker, AsyncSession
          from bot.models.base import Base
          from bot.models import User, Vehicle, Trip, TripPurpose
          from bot.services.pdf_report import generate_fahrtenbuch_pdf
          async def test():
              engine = create_async_engine('sqlite+aiosqlite:///:memory:')
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              Session = async_sessionmaker(engine, class_=AsyncSession, expire_on_commit=False)
              async with Session() as s:
                  u = User(telegram_id=1, name='CI Test', lang='de')
                  s.add(u); await s.commit(); await s.refresh(u)
                  v = Vehicle(user_id=u.id, make='VW', model='Golf', plate='CI-1', current_mileage=1000)
                  s.add(v); await s.commit(); await s.refresh(v)
                  trips = [Trip(user_id=u.id, vehicle_id=v.id, date=date(2025,1,1),
                               start_address_text='A', end_address_text='B',
                               start_mileage=1000, end_mileage=1045,
                               purpose=TripPurpose.BUSINESS)]
                  s.add_all(trips); await s.commit()
              pdf = generate_fahrtenbuch_pdf(u, v, trips, 'Jan', date(2025,1,1), date(2025,1,31))
              assert pdf[:4] == b'%PDF', 'PDF generation failed'
              print(f'✅ PDF OK — {len(pdf)} bytes')
          asyncio.run(test())
          "

  # ── Docker build ───────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to VPS ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/fahrtenbuch-bot

            # Оновити образ
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull bot

            # Запустити міграції
            docker compose run --rm migrate

            # Перезапустити бот
            docker compose up -d bot

            # Healthcheck
            sleep 5
            docker compose ps bot
            echo "✅ Deploy completed"
